# ========================================
# Nginx Configuration - Reverse Proxy
# Routes all frontend requests to appropriate backend services
# ========================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ========================================
    # UPSTREAM DEFINITIONS (Must match Docker Service Names)
    # ========================================

    upstream server_backend {
        # Matches service: 'server' in docker-compose
        server server:3000;
    }

    upstream n8n_backend {
        # FIX: Changed 'n8n' to 'n8n-second' (matches docker-compose)
        server n8n-second:5678;
    }

    upstream evolution_backend {
        # FIX 1: Changed 'evolution_api' to 'evolution_api_02'
        # FIX 2: Changed port 8083 to 8080 (Internal Container Port)
        server evolution_api_02:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase client body size for file uploads
        client_max_body_size 50M;

        # Root location - serve React static files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            # Support React Router (SPA routing)
            try_files $uri $uri/ /index.html;
        }

        # ========================================
        # API Routes - Proxy to Express Server
        # ========================================

        # Main gym API routes
        location /gym {
            proxy_pass http://server_backend/gym;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Plans API routes (without /gym prefix)
        location /plans {
            proxy_pass http://server_backend/plans;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes (notifications, insights, etc.)
        location /api {
            proxy_pass http://server_backend/api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # Static File Routes - Uploads & Invoices
        # ========================================

        # Member photos, staff photos, plan images, etc.
        location /uploads {
            proxy_pass http://server_backend/uploads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Cache static files
            proxy_cache_valid 200 1d;
            expires 1d;
        }

        # Invoice PDFs and other public assets
        location /public {
            proxy_pass http://server_backend/public;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # Automation Service Routes
        # ========================================

        # n8n automation API
        location /n8n-api/ {
            proxy_pass http://n8n_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Evolution API (WhatsApp)
        location /evolution-api/ {
            proxy_pass http://evolution_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}